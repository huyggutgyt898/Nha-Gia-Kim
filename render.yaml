services:
  - type: web
    name: nha-gia-kim
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Admin__InitialUsername
        value: admin
      - key: Admin__InitialPassword
        sync: false
